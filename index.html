<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Day 6</title>

  <style>
    /* RESET */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #333;
    }

    .logo {
      color: white;
      font-size: 22px;
      font-weight: bold;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    .nav-links li a {
      text-decoration: none;
      color: white;
      font-size: 16px;
    }

    .nav-links li a:hover {
      color: #ff9800;
    }

    /* SECTIONS */
    section {
      padding: 60px 30px;
      min-height: 100vh;
    }

    #home {
      background-color: #f5f5f5;
    }

    #about {
      background-color: #e0e0e0;
    }

    #services {
      background-color: #d0d0d0;
    }

    #contact {
      background-color: #c0c0c0;
    }

    h1 {
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <!-- NAVIGATION BAR -->
  <nav class="navbar">
    <div class="logo">Satic</div>
    <ul class="nav-links">
      <li><a href="#home">Home</a></li>
      <li><a href="#about">About</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <!-- PAGE CONTENT -->
  <section id="home">
    <h1>Home</h1>
    <p>Welcome to the Home section.</p>
  </section>

  <section id="about">
    <h1>About</h1>
    <p>This is the About section.</p>
  </section>

  <section id="services">
    <h1>Services</h1>
    <p>Details about services go here.</p>
  </section>

  <section id="contact">
    <h1>Contact</h1>
    <p>Contact information goes here.</p>
  </section>
  
  <script src="script.js"></script>

</body>
</html>
